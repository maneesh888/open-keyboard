name: Deploy iOS to App Store Connect

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: Upload the validated IPA to App Store Connect.
        required: true
        type: boolean
        default: false
      internal_testing_only:
        description: Restrict the uploaded build to internal TestFlight testing.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-before-deploy:
    name: Verify before deploy
    uses: ./.github/workflows/ci.yml

  validate-release-source:
    name: Validate trusted release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enforce trusted deployment ref
        run: ./scripts/validate-deployment-source.sh

  deploy-ios:
    name: Archive, validate, and upload
    runs-on: macos-15
    timeout-minutes: 60
    needs:
      - verify-before-deploy
      - validate-release-source
    environment: app-store-connect
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Revalidate trusted deployment ref after approval
        run: ./scripts/validate-deployment-source.sh

      - name: Validate deployment secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_CERTIFICATES_P12_BASE64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          IOS_CERTIFICATES_PASSWORD: ${{ secrets.IOS_CERTIFICATES_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          required_names=(
            APPLE_TEAM_ID
            KEYCHAIN_PASSWORD
            IOS_CERTIFICATES_P12_BASE64
            IOS_CERTIFICATES_PASSWORD
            IOS_APP_PROVISIONING_PROFILE_BASE64
            IOS_EXTENSION_PROVISIONING_PROFILE_BASE64
            APP_STORE_CONNECT_API_KEY_KEY_ID
            APP_STORE_CONNECT_API_KEY_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_P8
          )
          for required_name in "${required_names[@]}"; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required deployment secret: $required_name"
              exit 1
            fi
          done

      - name: Import signing certificate
        env:
          IOS_CERTIFICATES_P12_BASE64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          IOS_CERTIFICATES_PASSWORD: ${{ secrets.IOS_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          build_keychain="$RUNNER_TEMP/openkeyboard-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$build_keychain"
          security default-keychain -s "$build_keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$build_keychain"
          security set-keychain-settings -lut 21600 "$build_keychain"

          printf '%s' "$IOS_CERTIFICATES_P12_BASE64" |
            base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$build_keychain" \
            -P "$IOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$build_keychain"

      - name: Install provisioning profiles
        id: profiles
        env:
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_directory"

          install_profile() {
            local encoded="$1"
            local label="$2"
            local profile_file="$RUNNER_TEMP/$label.mobileprovision"
            local plist_file="$RUNNER_TEMP/$label.plist"
            local uuid

            printf '%s' "$encoded" | base64 --decode > "$profile_file"
            security cms -D -i "$profile_file" > "$plist_file"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist_file")"
            cp "$profile_file" "$profiles_directory/$uuid.mobileprovision"
            printf '%s' "$uuid"
          }

          app_profile_uuid="$(install_profile "$IOS_APP_PROVISIONING_PROFILE_BASE64" app)"
          extension_profile_uuid="$(install_profile "$IOS_EXTENSION_PROVISIONING_PROFILE_BASE64" extension)"
          echo "app_profile_uuid=$app_profile_uuid" >> "$GITHUB_OUTPUT"
          echo "extension_profile_uuid=$extension_profile_uuid" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" \
            > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_KEY_ID}.p8"

      - name: Set CI build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" OpenKeyboard/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" OpenKeyboardExtension/Info.plist

      - name: Archive release build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild clean archive \
            -project OpenKeyboard.xcodeproj \
            -scheme OpenKeyboard \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/OpenKeyboard.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PROFILE_UUID: ${{ steps.profiles.outputs.app_profile_uuid }}
          EXTENSION_PROFILE_UUID: ${{ steps.profiles.outputs.extension_profile_uuid }}
          INTERNAL_TESTING_ONLY: ${{ inputs.internal_testing_only }}
        run: |
          internal_testing_only="${INTERNAL_TESTING_ONLY:-true}"
          if [[ "$internal_testing_only" != "true" && "$internal_testing_only" != "false" ]]; then
            echo "internal_testing_only must be true or false."
            exit 1
          fi

          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.maneesh.openkeyboard</key>
              <string>${APP_PROFILE_UUID}</string>
              <key>com.maneesh.openkeyboard.keyboard</key>
              <string>${EXTENSION_PROFILE_UUID}</string>
            </dict>
            <key>testFlightInternalTestingOnly</key>
            <${internal_testing_only}/>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenKeyboard.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Validate IPA
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          ipa_path="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "No IPA was produced."
            exit 1
          fi
          xcrun altool --validate-app \
            -f "$ipa_path" \
            --api-key "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - name: Upload IPA
        if: github.event_name == 'push' || inputs.upload_to_app_store_connect == true
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          ipa_path="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          xcrun altool --upload-app \
            -f "$ipa_path" \
            --api-key "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openkeyboard-ios-deploy-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/OpenKeyboard.xcarchive
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/openkeyboard-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -rf "$RUNNER_TEMP/private_keys"
