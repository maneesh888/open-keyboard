name: OpenKeyboard CI

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  requirement-evidence:
    name: Requirement evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare trusted requirement validators
        id: validators
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          validator_root="$RUNNER_TEMP/requirement-validators"
          mkdir -p "$validator_root"
          for validator_name in validate-pr-requirements.sh validate-pr-review-record.sh; do
            validator_path="$validator_root/$validator_name"
            if git cat-file -e "$PR_BASE_SHA:scripts/$validator_name" 2>/dev/null; then
              git show "$PR_BASE_SHA:scripts/$validator_name" > "$validator_path"
            else
              cp "scripts/$validator_name" "$validator_path"
            fi
            chmod +x "$validator_path"
          done
          echo "root=$validator_root" >> "$GITHUB_OUTPUT"

      - name: Validate complete requirement coverage and independent review
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          "$VALIDATOR_ROOT/validate-pr-requirements.sh"
          reviews_file="$RUNNER_TEMP/pull-request-reviews.json"
          gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            | jq --slurp 'add' > "$reviews_file"
          contributors_file="$RUNNER_TEMP/pull-request-commits.json"
          gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            | jq --slurp 'add' > "$contributors_file"
          REVIEWS_JSON_FILE="$reviews_file" CONTRIBUTORS_JSON_FILE="$contributors_file" \
            "$VALIDATOR_ROOT/validate-pr-review-record.sh"

      - name: Confirm non-PR invocation
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        run: echo "Requirement evidence is enforced on pull requests."

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run repository hygiene
        run: ./scripts/check.sh --hygiene

  core-tests:
    name: OpenKeyboardCore tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Run core Swift package tests
        run: ./scripts/ios/test.sh core

  ios-build:
    name: iOS app + keyboard extension build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Build OpenKeyboard app and extension
        run: ./scripts/ios/test.sh build

  semantic-contract:
    name: Semantic prompt contract
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate and pinned contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Vendor/semantic-prompt-contract/package-lock.json

      - name: Validate pinned semantic contract
        run: ./scripts/check-semantic-prompt-contract.sh

  required-checks:
    name: Required checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - requirement-evidence
      - hygiene
      - core-tests
      - ios-build
      - semantic-contract
    steps:
      - name: Confirm required jobs passed
        env:
          REQUIREMENT_EVIDENCE_RESULT: ${{ needs.requirement-evidence.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-build.result }}
          SEMANTIC_CONTRACT_RESULT: ${{ needs.semantic-contract.result }}
        run: |
          if [[ "$REQUIREMENT_EVIDENCE_RESULT" != "success" ||
                "$HYGIENE_RESULT" != "success" ||
                "$CORE_TESTS_RESULT" != "success" ||
                "$IOS_BUILD_RESULT" != "success" ||
                "$SEMANTIC_CONTRACT_RESULT" != "success" ]]; then
            echo "Required checks did not pass."
            echo "requirement-evidence=$REQUIREMENT_EVIDENCE_RESULT"
            echo "hygiene=$HYGIENE_RESULT"
            echo "core-tests=$CORE_TESTS_RESULT"
            echo "ios-build=$IOS_BUILD_RESULT"
            echo "semantic-contract=$SEMANTIC_CONTRACT_RESULT"
            exit 1
          fi

          echo "All required OpenKeyboard checks passed."
