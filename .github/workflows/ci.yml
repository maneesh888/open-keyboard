name: OpenKeyboard CI

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  queue: max

jobs:
  requirement-evidence:
    name: Classify review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evidence_ready: ${{ steps.review-evidence.outputs.ready }}
      emit_incomplete: ${{ steps.review-check-history.outputs.emit_incomplete }}
      history_poisoned: ${{ steps.review-check-history.outputs.history_poisoned }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare trusted requirement validators
        id: validators
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          validator_root="$RUNNER_TEMP/requirement-validators"
          mkdir -p "$validator_root"
          for validator_name in \
            validate-pr-requirements.sh \
            validate-pr-review-record.sh \
            classify-review-check-state.sh; do
            validator_path="$validator_root/$validator_name"
            if git cat-file -e "$PR_BASE_SHA:scripts/$validator_name" 2>/dev/null; then
              git show "$PR_BASE_SHA:scripts/$validator_name" > "$validator_path"
            else
              cp "scripts/$validator_name" "$validator_path"
            fi
            chmod +x "$validator_path"
          done
          echo "root=$validator_root" >> "$GITHUB_OUTPUT"

      - name: Validate complete requirement coverage and independent review
        id: review-evidence
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          reviews_file="$RUNNER_TEMP/pull-request-reviews.json"
          event_review_file=""
          requirement_output="$RUNNER_TEMP/requirement-evidence.out"
          review_output="$RUNNER_TEMP/review-record.out"
          event_head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          if [[ "$event_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "The pull-request event head does not match the workflow head." >&2
            exit 1
          fi

          export HEAD_SHA="$EVENT_HEAD_SHA"
          export PR_BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          export PR_URL="$(jq -er '.pull_request.html_url' "$GITHUB_EVENT_PATH")"
          gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            | jq --slurp 'add' > "$reviews_file"

          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            event_review_file="$RUNNER_TEMP/event-review.json"
            jq -e '.review | objects' "$GITHUB_EVENT_PATH" > "$event_review_file"
          fi

          : > "$requirement_output"
          : > "$review_output"
          requirement_status=0
          review_status=0
          "$VALIDATOR_ROOT/validate-pr-requirements.sh" >"$requirement_output" 2>&1 || requirement_status=$?
          if [[ "$requirement_status" -eq 0 ]]; then
            EVENT_REVIEW_JSON_FILE="$event_review_file" \
              REVIEWS_JSON_FILE="$reviews_file" \
              "$VALIDATOR_ROOT/validate-pr-review-record.sh" >"$review_output" 2>&1 || review_status=$?
          else
            review_status=1
          fi

          evidence_ready=false
          if [[ "$requirement_status" -eq 0 && "$review_status" -eq 0 ]]; then
            evidence_ready=true
          fi

          if [[ "$evidence_ready" == "true" ]]; then
            cat "$requirement_output" "$review_output"
          else
            if [[ -s "$requirement_output" ]]; then
              cat "$requirement_output" >&2
            fi
            if [[ -s "$review_output" ]]; then
              cat "$review_output" >&2
            fi
            echo "Exact-head review evidence is incomplete; the protected review check will not be emitted." >&2
          fi
          echo "ready=$evidence_ready" >> "$GITHUB_OUTPUT"

      - name: Classify protected review-check history
        id: review-check-history
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          EVIDENCE_READY: ${{ steps.review-evidence.outputs.ready }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          check_runs_pages="$RUNNER_TEMP/required-review-check-runs.pages.json"
          check_runs_file="$RUNNER_TEMP/required-review-check-runs.json"
          history_resolved=false

          for ((attempt = 1; attempt <= 3; attempt += 1)); do
            : > "$check_runs_pages"
            if gh api \
              --method GET \
              --paginate \
              "repos/$GITHUB_REPOSITORY/commits/$EVENT_HEAD_SHA/check-runs" \
              -f check_name='Required checks' \
              -f filter=all \
              -f status=completed \
              -F per_page=100 > "$check_runs_pages" &&
              jq --slurp '[.[].check_runs[]]' "$check_runs_pages" > "$check_runs_file"; then
              history_resolved=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          if [[ "$history_resolved" != "true" ]]; then
            echo "Unable to inspect protected review-check history; failing closed." >&2
            exit 1
          fi

          EVIDENCE_READY="$EVIDENCE_READY" \
            "$VALIDATOR_ROOT/classify-review-check-state.sh" "$check_runs_file" >> "$GITHUB_OUTPUT"

      - name: Confirm non-PR invocation
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        run: echo "Requirement evidence is enforced on pull requests."

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run repository hygiene
        run: ./scripts/check.sh --hygiene

  core-tests:
    name: OpenKeyboardCore tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Run core Swift package tests
        run: ./scripts/ios/test.sh core

  ios-build:
    name: iOS app + keyboard extension build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Build OpenKeyboard app and extension
        run: ./scripts/ios/test.sh build

  semantic-contract:
    name: Semantic prompt contract
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate and pinned contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Vendor/semantic-prompt-contract/package-lock.json

      - name: Validate pinned semantic contract
        run: ./scripts/check-semantic-prompt-contract.sh

  required-technical-checks:
    name: Required technical checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - core-tests
      - ios-build
      - semantic-contract
    steps:
      - name: Confirm required jobs passed
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-build.result }}
          SEMANTIC_CONTRACT_RESULT: ${{ needs.semantic-contract.result }}
        run: |
          if [[ "$HYGIENE_RESULT" != "success" ||
                "$CORE_TESTS_RESULT" != "success" ||
                "$IOS_BUILD_RESULT" != "success" ||
                "$SEMANTIC_CONTRACT_RESULT" != "success" ]]; then
            echo "Required technical checks did not pass."
            echo "hygiene=$HYGIENE_RESULT"
            echo "core-tests=$CORE_TESTS_RESULT"
            echo "ios-build=$IOS_BUILD_RESULT"
            echo "semantic-contract=$SEMANTIC_CONTRACT_RESULT"
            exit 1
          fi

          echo "All required OpenKeyboard technical checks passed."

  required-review-evidence:
    name: ${{ needs.requirement-evidence.outputs.emit_incomplete == 'true' && 'Incomplete review evidence' || 'Required checks' }}
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    needs:
      - requirement-evidence
    steps:
      - name: Emit protected review status only for complete evidence
        env:
          EVIDENCE_JOB_RESULT: ${{ needs.requirement-evidence.result }}
          EVIDENCE_READY: ${{ needs.requirement-evidence.outputs.evidence_ready }}
          EMIT_INCOMPLETE: ${{ needs.requirement-evidence.outputs.emit_incomplete }}
          HISTORY_POISONED: ${{ needs.requirement-evidence.outputs.history_poisoned }}
        run: |
          if [[ "$EVIDENCE_JOB_RESULT" != "success" ||
                "$EVIDENCE_READY" != "true" ||
                "$HISTORY_POISONED" == "true" ]]; then
            echo "Exact-head review evidence is incomplete."
            if [[ "$HISTORY_POISONED" == "true" ]]; then
              echo "This SHA was permanently invalidated by an earlier protected review failure."
              echo "Push a new commit and repeat the exact-head proof and review cycle."
            elif [[ "$EMIT_INCOMPLETE" == "true" ]]; then
              echo "The protected 'Required checks' context was intentionally not emitted."
            else
              echo "The protected review status is failing closed."
            fi
            exit 1
          fi

          echo "Exact-head requirement and independent-review evidence passed."
