name: OpenKeyboard CI

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.action || 'none' }}
  cancel-in-progress: true

jobs:
  requirement-evidence:
    name: Classify review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evidence_ready: ${{ steps.review-evidence.outputs.ready }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare trusted requirement validators
        id: validators
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          validator_root="$RUNNER_TEMP/requirement-validators"
          mkdir -p "$validator_root"
          for validator_name in validate-pr-requirements.sh validate-pr-review-record.sh; do
            validator_path="$validator_root/$validator_name"
            if git cat-file -e "$PR_BASE_SHA:scripts/$validator_name" 2>/dev/null; then
              git show "$PR_BASE_SHA:scripts/$validator_name" > "$validator_path"
            else
              cp "scripts/$validator_name" "$validator_path"
            fi
            chmod +x "$validator_path"
          done
          echo "root=$validator_root" >> "$GITHUB_OUTPUT"

      - name: Validate complete requirement coverage and independent review
        id: review-evidence
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          reviews_file="$RUNNER_TEMP/pull-request-reviews.json"
          requirement_output="$RUNNER_TEMP/requirement-evidence.out"
          review_output="$RUNNER_TEMP/review-record.out"
          evidence_ready=false
          max_attempts=1
          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            max_attempts=12
          fi

          for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
            current_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            current_head_sha="$(jq -er '.head.sha' <<<"$current_pr_json")"
            if [[ "$current_head_sha" != "$EVENT_HEAD_SHA" ]]; then
              echo "The pull-request head changed while validating review evidence." >&2
              break
            fi

            export HEAD_SHA="$EVENT_HEAD_SHA"
            export PR_BODY="$(jq -r '.body // ""' <<<"$current_pr_json")"
            export PR_URL="$(jq -er '.html_url' <<<"$current_pr_json")"
            gh api \
              --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
              | jq --slurp 'add' > "$reviews_file"

            : > "$requirement_output"
            : > "$review_output"
            requirement_status=0
            review_status=0
            "$VALIDATOR_ROOT/validate-pr-requirements.sh" >"$requirement_output" 2>&1 || requirement_status=$?
            if [[ "$requirement_status" -eq 0 ]]; then
              REVIEWS_JSON_FILE="$reviews_file" "$VALIDATOR_ROOT/validate-pr-review-record.sh" >"$review_output" 2>&1 || review_status=$?
            else
              review_status=1
            fi

            if [[ "$requirement_status" -eq 0 && "$review_status" -eq 0 ]]; then
              evidence_ready=true
              break
            fi
            if [[ "$attempt" -lt "$max_attempts" ]]; then
              sleep 5
            fi
          done

          if [[ "$evidence_ready" == "true" ]]; then
            cat "$requirement_output" "$review_output"
          else
            if [[ -s "$requirement_output" ]]; then
              cat "$requirement_output" >&2
            fi
            if [[ -s "$review_output" ]]; then
              cat "$review_output" >&2
            fi
            echo "Exact-head review evidence is incomplete; the protected review check will not be emitted." >&2
          fi
          echo "ready=$evidence_ready" >> "$GITHUB_OUTPUT"

      - name: Confirm non-PR invocation
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        run: echo "Requirement evidence is enforced on pull requests."

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run repository hygiene
        run: ./scripts/check.sh --hygiene

  core-tests:
    name: OpenKeyboardCore tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Run core Swift package tests
        run: ./scripts/ios/test.sh core

  ios-build:
    name: iOS app + keyboard extension build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Build OpenKeyboard app and extension
        run: ./scripts/ios/test.sh build

  semantic-contract:
    name: Semantic prompt contract
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate and pinned contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Vendor/semantic-prompt-contract/package-lock.json

      - name: Validate pinned semantic contract
        run: ./scripts/check-semantic-prompt-contract.sh

  required-technical-checks:
    name: Required technical checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - core-tests
      - ios-build
      - semantic-contract
    steps:
      - name: Confirm required jobs passed
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-build.result }}
          SEMANTIC_CONTRACT_RESULT: ${{ needs.semantic-contract.result }}
        run: |
          if [[ "$HYGIENE_RESULT" != "success" ||
                "$CORE_TESTS_RESULT" != "success" ||
                "$IOS_BUILD_RESULT" != "success" ||
                "$SEMANTIC_CONTRACT_RESULT" != "success" ]]; then
            echo "Required technical checks did not pass."
            echo "hygiene=$HYGIENE_RESULT"
            echo "core-tests=$CORE_TESTS_RESULT"
            echo "ios-build=$IOS_BUILD_RESULT"
            echo "semantic-contract=$SEMANTIC_CONTRACT_RESULT"
            exit 1
          fi

          echo "All required OpenKeyboard technical checks passed."

  required-review-evidence:
    name: ${{ needs.requirement-evidence.outputs.evidence_ready == 'true' && 'Required checks' || 'Incomplete review evidence' }}
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    needs:
      - requirement-evidence
    steps:
      - name: Emit protected review status only for complete evidence
        env:
          EVIDENCE_JOB_RESULT: ${{ needs.requirement-evidence.result }}
          EVIDENCE_READY: ${{ needs.requirement-evidence.outputs.evidence_ready }}
        run: |
          if [[ "$EVIDENCE_JOB_RESULT" != "success" || "$EVIDENCE_READY" != "true" ]]; then
            echo "Exact-head review evidence is incomplete."
            echo "The protected 'Required checks' context was intentionally not emitted."
            exit 1
          fi

          echo "Exact-head requirement and independent-review evidence passed."
