name: OpenKeyboard Live Verification Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  required-live-verification:
    name: Required live verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: live-policy
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Prepare trusted live-policy validators
        id: validators
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          validator_root="$RUNNER_TEMP/live-policy-validators"
          mkdir -p "$validator_root"
          for validator_name in \
            live-impact.sh \
            validate-pr-live-evidence.sh; do
            validator_path="$validator_root/$validator_name"
            if git cat-file -e "$PR_BASE_SHA:scripts/$validator_name" 2>/dev/null; then
              git show "$PR_BASE_SHA:scripts/$validator_name" > "$validator_path"
            else
              cp "scripts/$validator_name" "$validator_path"
            fi
            chmod +x "$validator_path"
          done
          echo "root=$validator_root" >> "$GITHUB_OUTPUT"
          if grep -Fq 'gateway-differential' "$validator_root/live-impact.sh" && \
              grep -Fq 'gateway-differential' "$validator_root/validate-pr-live-evidence.sh"; then
            echo "supports_differential=true" >> "$GITHUB_OUTPUT"
          else
            echo "supports_differential=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify exact-head live impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
          TRUSTED_SUPPORTS_DIFFERENTIAL: ${{ steps.validators.outputs.supports_differential }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$PR_HEAD_SHA" ]]; then
            echo "The checked-out commit does not match the pull-request head." >&2
            exit 1
          fi

          trusted_live_impact="$(
            OPEN_KEYBOARD_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
              "$VALIDATOR_ROOT/live-impact.sh" "$PR_BASE_SHA" "$PR_HEAD_SHA"
          )"
          case "$trusted_live_impact" in
            none|gateway|gateway-differential)
              ;;
            *)
              echo "Live-impact classification returned an invalid result." >&2
              exit 1
              ;;
          esac

          live_impact="$trusted_live_impact"
          bootstrap_differential="false"
          if [[ "$TRUSTED_SUPPORTS_DIFFERENTIAL" != "true" && "$trusted_live_impact" == "gateway" ]]; then
            candidate_live_impact="$(
              OPEN_KEYBOARD_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
                "$GITHUB_WORKSPACE/scripts/live-impact.sh" "$PR_BASE_SHA" "$PR_HEAD_SHA"
            )"
            case "$candidate_live_impact" in
              gateway-differential)
                live_impact="gateway-differential"
                bootstrap_differential="true"
                ;;
              none|gateway)
                ;;
              *)
                echo "Candidate live-impact classification returned an invalid result." >&2
                exit 1
                ;;
            esac
          fi

          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The pull-request head is not a full commit SHA." >&2
            exit 1
          fi

          echo "TRUSTED_LIVE_IMPACT=$trusted_live_impact" >> "$GITHUB_ENV"
          echo "LIVE_IMPACT=$live_impact" >> "$GITHUB_ENV"
          echo "LIVE_POLICY_BOOTSTRAP_DIFFERENTIAL=$bootstrap_differential" >> "$GITHUB_ENV"

      - name: Resolve immutable and current live-evidence snapshots
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BODY_FILE: ${{ runner.temp }}/event-pull-request-body.md
          CURRENT_BODY_FILE: ${{ runner.temp }}/current-pull-request-body.md
        run: |
          event_head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          if [[ "$event_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "The pull-request event head does not match the workflow head." >&2
            exit 1
          fi
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$EVENT_BODY_FILE"

          current_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_head_sha="$(jq -er '.head.sha' <<<"$current_pr_json")"
          if [[ "$current_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "The pull-request head changed before live-evidence validation." >&2
            exit 1
          fi
          jq -r '.body // ""' <<<"$current_pr_json" > "$CURRENT_BODY_FILE"

      - name: Enforce event and current exact-head live evidence
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BODY_FILE: ${{ runner.temp }}/event-pull-request-body.md
          CURRENT_BODY_FILE: ${{ runner.temp }}/current-pull-request-body.md
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          for snapshot_name in event current; do
            case "$snapshot_name" in
              event)
                body_file="$EVENT_BODY_FILE"
                ;;
              current)
                body_file="$CURRENT_BODY_FILE"
                ;;
            esac
            if [[ ! -f "$body_file" ]]; then
              echo "The $snapshot_name live-evidence snapshot is unavailable." >&2
              exit 1
            fi

            echo "Validating $snapshot_name live-evidence snapshot."
            if [[ "$LIVE_POLICY_BOOTSTRAP_DIFFERENTIAL" == "true" ]]; then
              HEAD_SHA="$EVENT_HEAD_SHA" \
                LIVE_IMPACT="gateway-differential" \
                PR_BODY="$(< "$body_file")" \
                "$GITHUB_WORKSPACE/scripts/validate-pr-live-evidence.sh"

              required_models="$(sed -n 's/^- Required live models: //p' "$body_file")"
              tested_models="$(sed -n 's/^- Exact live-tested models: //p' "$body_file")"
              if [[ ! "$required_models" =~ ^low=([A-Za-z0-9][A-Za-z0-9._:/+-]*),\ high=([A-Za-z0-9][A-Za-z0-9._:/+-]*)$ ]]; then
                echo "Bootstrap differential required-model mapping is invalid." >&2
                exit 1
              fi
              required_high_model="${BASH_REMATCH[2]}"
              if [[ ! "$tested_models" =~ ^low=([A-Za-z0-9][A-Za-z0-9._:/+-]*),\ high=([A-Za-z0-9][A-Za-z0-9._:/+-]*)$ ]]; then
                echo "Bootstrap differential tested-model mapping is invalid." >&2
                exit 1
              fi
              tested_high_model="${BASH_REMATCH[2]}"

              trusted_projection="$RUNNER_TEMP/$snapshot_name-trusted-gateway-projection.md"
              {
                echo '- Local live verification: passed'
                echo '- Live verification target: gateway'
                echo "- Exact live-tested head: $EVENT_HEAD_SHA"
                echo "- Required live models: $required_high_model"
                echo "- Exact live-tested models: $tested_high_model"
                echo '- Live-model substitutions: none'
                echo '- Live plain-text grammar verification: verified'
                echo '- No credential or gateway response body retained.'
                echo '- Trust boundary: local execution is contributor-attested; GitHub verifies retained exact-head evidence only.'
              } > "$trusted_projection"
              HEAD_SHA="$EVENT_HEAD_SHA" \
                LIVE_IMPACT="$TRUSTED_LIVE_IMPACT" \
                PR_BODY="$(< "$trusted_projection")" \
                "$VALIDATOR_ROOT/validate-pr-live-evidence.sh"
            else
              HEAD_SHA="$EVENT_HEAD_SHA" \
                LIVE_IMPACT="$LIVE_IMPACT" \
                PR_BODY="$(< "$body_file")" \
                "$VALIDATOR_ROOT/validate-pr-live-evidence.sh"
            fi
          done
