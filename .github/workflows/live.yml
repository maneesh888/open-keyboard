name: OpenKeyboard Live Verification Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  required-live-verification:
    name: Required live verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: live-policy
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Prepare trusted live-policy validators
        id: validators
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          validator_root="$RUNNER_TEMP/live-policy-validators"
          mkdir -p "$validator_root"
          for validator_name in \
            live-impact.sh \
            validate-pr-live-evidence.sh; do
            validator_path="$validator_root/$validator_name"
            git show "$PR_BASE_SHA:scripts/$validator_name" > "$validator_path"
            chmod +x "$validator_path"
          done
          # Assessment decisions always use the base-owned helper when available.
          if git cat-file -e "$PR_BASE_SHA:scripts/verification-assessment.py" 2>/dev/null; then
            git show "$PR_BASE_SHA:scripts/verification-assessment.py" > "$validator_root/verification-assessment.py"
          fi
          echo "root=$validator_root" >> "$GITHUB_OUTPUT"
          if ! grep -Fxq 'readonly OPEN_KEYBOARD_REDACTED_LIVE_EVIDENCE_SCHEMA=1' "$validator_root/validate-pr-live-evidence.sh"; then
            echo "Trusted base lacks the private assertion schema; update the base before verification." >&2
            exit 1
          fi

      - name: Classify exact-head live impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$PR_HEAD_SHA" ]]; then
            echo "The checked-out commit does not match the pull-request head." >&2
            exit 1
          fi

          trusted_live_impact="$(
            OPEN_KEYBOARD_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
              "$VALIDATOR_ROOT/live-impact.sh" "$PR_BASE_SHA" "$PR_HEAD_SHA"
          )"
          case "$trusted_live_impact" in
            none|gateway|gateway-differential)
              ;;
            *)
              echo "Live-impact classification returned an invalid result." >&2
              exit 1
              ;;
          esac

          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The pull-request head is not a full commit SHA." >&2
            exit 1
          fi
          # Policy code can change applicability without an unrelated model call.
          # This is a candidate-workflow trust boundary, independently reviewed with
          # the full contents; it never authorizes merge or replaces trusted validators.
          policy_only="$(python3 -I <<'PY_POLICY'
          import os
          import subprocess

          # This exact allowlist is a reviewed CI policy boundary, not proof of file safety.
          # Existing entries may only be modified; additions are explicitly designated.
          existing = {
              ".agents/skills/develop-openkeyboard/SKILL.md": "100644",
              ".agents/skills/review-verify-merge-pr/SKILL.md": "100644",
              ".codex/agents/pr-reviewer.toml": "100644",
              ".github/pull_request_template.md": "100644",
              ".github/workflows/live.yml": "100644",
              "AGENTS.md": "100644",
              "docs/DEVELOPMENT_WORKFLOW.md": "100644",
              "scripts/check-environment.sh": "100755",
              "scripts/check.sh": "100755",
              "scripts/live-impact.sh": "100755",
              "scripts/tests/live-evidence-policy-test.sh": "100755",
              "scripts/tests/live-impact-test.sh": "100755",
              "scripts/tests/live-policy-bootstrap-test.sh": "100755",
              "scripts/tests/workflow-policy-test.sh": "100755",
          }
          addable = {
              "docs/VERIFICATION_APPLICABILITY.md": "100644",
              "scripts/verification-assessment.py": "100644",
              "scripts/tests/verification-assessment-test.py": "100644",
              "scripts/tests/policy-only-workflow-test.py": "100644",
          }

          def git(*args):
              return subprocess.check_output(["git", *args])

          base = git("merge-base", os.environ["PR_BASE_SHA"], os.environ["PR_HEAD_SHA"]).decode().strip()
          # Raw, NUL-delimited, no rename collapsing, and no pathspec: enumerate the whole diff.
          raw = git("diff", "--raw", "--no-abbrev", "--no-renames", "-z", base, os.environ["PR_HEAD_SHA"], "--")
          records = raw.split(b"\0")
          if records.pop() != b"" or len(records) % 2:
              raise SystemExit("Incomplete policy diff enumeration")
          eligible = bool(records)
          for index in range(0, len(records), 2):
              fields = records[index].decode("ascii").split()
              if len(fields) != 5 or not fields[0].startswith(":"):
                  raise SystemExit("Malformed policy diff enumeration")
              before, after, _, _, status = fields
              path = os.fsdecode(records[index + 1])
              expected = existing.get(path, addable.get(path))
              modification = status == "M" and before[1:] == after == expected
              addition = status == "A" and path in addable and before == ":000000" and after == expected
              eligible = eligible and (modification or addition)
          print("true" if eligible else "false")
          PY_POLICY
          )"
          if [[ "$policy_only" == true ]]; then
            echo "Live execution is not required by the revised policy-only applicability rule."
            trusted_live_impact=none
          elif [[ "$policy_only" != false ]]; then
            echo "Invalid policy-only classification." >&2
            exit 1
          fi
          echo "LIVE_IMPACT=$trusted_live_impact" >> "$GITHUB_ENV"

      - name: Resolve immutable and current live-evidence snapshots
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BODY_FILE: ${{ runner.temp }}/event-pull-request-body.md
          CURRENT_BODY_FILE: ${{ runner.temp }}/current-pull-request-body.md
        run: |
          event_head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          if [[ "$event_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "The pull-request event head does not match the workflow head." >&2
            exit 1
          fi
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$EVENT_BODY_FILE"

          current_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_head_sha="$(jq -er '.head.sha' <<<"$current_pr_json")"
          if [[ "$current_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "The pull-request head changed before live-evidence validation." >&2
            exit 1
          fi
          jq -r '.body // ""' <<<"$current_pr_json" > "$CURRENT_BODY_FILE"

      - name: Enforce event and current exact-head live evidence
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BODY_FILE: ${{ runner.temp }}/event-pull-request-body.md
          CURRENT_BODY_FILE: ${{ runner.temp }}/current-pull-request-body.md
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for snapshot_name in event current; do
            case "$snapshot_name" in
              event)
                body_file="$EVENT_BODY_FILE"
                ;;
              current)
                body_file="$CURRENT_BODY_FILE"
                ;;
            esac
            if [[ ! -f "$body_file" ]]; then
              echo "The $snapshot_name live-evidence snapshot is unavailable." >&2
              exit 1
            fi

            if [[ -f "$VALIDATOR_ROOT/verification-assessment.py" ]]; then
              python3 "$VALIDATOR_ROOT/verification-assessment.py" \
                "$GITHUB_WORKSPACE" "$PR_BASE_SHA" "$EVENT_HEAD_SHA" "$LIVE_IMPACT" "$body_file"
            fi
            echo "Validating $snapshot_name live-evidence snapshot."
            HEAD_SHA="$EVENT_HEAD_SHA" \
              LIVE_IMPACT="$LIVE_IMPACT" \
              PR_BODY="$(< "$body_file")" \
              "$VALIDATOR_ROOT/validate-pr-live-evidence.sh"
          done
