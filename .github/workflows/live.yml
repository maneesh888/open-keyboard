name: OpenKeyboard Live Verification Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  live-policy-routing:
    name: Resolve live-policy environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.route.outputs.environment }}
      migration_ready: ${{ steps.route.outputs.migration_ready }}
    steps:
      - name: Resolve protected migration route without candidate code
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          # Default only to the existing environment. Never reference a missing migration
          # environment: GitHub would implicitly create it without protection.
          echo "environment=live-policy" >> "$GITHUB_OUTPUT"
          echo "migration_ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$PR_BASE_SHA" != 6619f0bb1f3aa8306a4b1dc94b2fdd514ee1f6f6 ]]; then
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/live-policy-migration" > "$RUNNER_TEMP/migration-environment.json"; then
            echo "The owner must configure the protected migration environment first."
            exit 0
          fi
          if ! jq -e --argjson owner "$OWNER_ID" '
            .name == "live-policy-migration" and (.id | type == "number") and
            ([.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] |
             length == 1 and .[0].type == "User" and .[0].reviewer.id == $owner)
          ' "$RUNNER_TEMP/migration-environment.json" >/dev/null; then
            echo "Migration environment must require the repository owner as its sole reviewer."
            exit 0
          fi
          echo "environment=live-policy-migration" >> "$GITHUB_OUTPUT"
          echo "migration_ready=true" >> "$GITHUB_OUTPUT"

  migration-approval:
    name: Approve pinned privacy-schema migration
    needs: live-policy-routing
    if: needs.live-policy-routing.outputs.migration_ready == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.live-policy-routing.outputs.environment }}
    steps:
      - name: Record owner approval gate
        run: echo "The owner-approved environment gate completed; rerun failed required verification for this run."

  required-live-verification:
    name: Required live verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: live-policy
    steps:
      - name: Verify actual migration approval before candidate checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          if [[ "$PR_BASE_SHA" != 6619f0bb1f3aa8306a4b1dc94b2fdd514ee1f6f6 ]]; then
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/environments/live-policy-migration" > "$RUNNER_TEMP/migration-environment.json"
          jq -e --argjson owner "$OWNER_ID" '
            .name == "live-policy-migration" and (.id | type == "number") and
            ([.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] |
             length == 1 and .[0].type == "User" and .[0].reviewer.id == $owner)
          ' "$RUNNER_TEMP/migration-environment.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/migration-run.json"
          jq -e --arg head "$PR_HEAD_SHA" '.head_sha == $head and .event == "pull_request"' \
            "$RUNNER_TEMP/migration-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/migration-approvals.json"
          environment_id="$(jq -er '.id | numbers' "$RUNNER_TEMP/migration-environment.json")"
          jq -e --argjson owner "$OWNER_ID" --argjson environment_id "$environment_id" '
            all(.[]; all(.environments[];
              .name != "live-policy-migration" or .id == $environment_id)) and
            ([.[] | select(any(.environments[]; .id == $environment_id))] |
              length > 0 and all(.[]; .state == "approved" and .user.id == $owner))
          ' "$RUNNER_TEMP/migration-approvals.json" >/dev/null
          echo "Owner-approved migration run $GITHUB_RUN_ID for exact head $PR_HEAD_SHA."

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Prepare trusted live-policy validators
        id: validators
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          validator_root="$RUNNER_TEMP/live-policy-validators"
          mkdir -p "$validator_root"
          # After migration the bootstrap itself is taken from the trusted base. Candidate
          # migration code is permitted only for the pinned base after actual owner approval.
          if git show "$PR_BASE_SHA:scripts/live-policy-bootstrap.sh" | grep -Fq 'openkeyboard_prepare_live_validators()'; then
            git show "$PR_BASE_SHA:scripts/live-policy-bootstrap.sh" > "$validator_root/bootstrap.sh"
          else
            if [[ "$PR_BASE_SHA" != 6619f0bb1f3aa8306a4b1dc94b2fdd514ee1f6f6 ]]; then
              echo "Unknown or unapproved legacy bootstrap." >&2
              exit 1
            fi
            cp scripts/live-policy-bootstrap.sh "$validator_root/bootstrap.sh"
          fi
          source "$validator_root/bootstrap.sh"
          openkeyboard_prepare_live_validators "$PR_BASE_SHA" "$validator_root" "$GITHUB_WORKSPACE"
          echo "root=$validator_root" >> "$GITHUB_OUTPUT"

      - name: Classify exact-head live impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$PR_HEAD_SHA" || ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The checked-out commit does not match the pull-request head." >&2
            exit 1
          fi
          trusted_live_impact="$(
            OPEN_KEYBOARD_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
              "$VALIDATOR_ROOT/live-impact.sh" "$PR_BASE_SHA" "$PR_HEAD_SHA"
          )"
          case "$trusted_live_impact" in
            none|gateway|gateway-differential) ;;
            *) echo "Invalid trusted live-impact classification." >&2; exit 1 ;;
          esac
          echo "LIVE_IMPACT=$trusted_live_impact" >> "$GITHUB_ENV"

      - name: Resolve immutable and current live-evidence snapshots
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BODY_FILE: ${{ runner.temp }}/event-pull-request-body.md
          CURRENT_BODY_FILE: ${{ runner.temp }}/current-pull-request-body.md
        run: |
          event_head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          if [[ "$event_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "The pull-request event head does not match the workflow head." >&2
            exit 1
          fi
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$EVENT_BODY_FILE"

          current_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_head_sha="$(jq -er '.head.sha' <<<"$current_pr_json")"
          if [[ "$current_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "The pull-request head changed before live-evidence validation." >&2
            exit 1
          fi
          jq -r '.body // ""' <<<"$current_pr_json" > "$CURRENT_BODY_FILE"

      - name: Enforce event and current exact-head live evidence
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BODY_FILE: ${{ runner.temp }}/event-pull-request-body.md
          CURRENT_BODY_FILE: ${{ runner.temp }}/current-pull-request-body.md
          VALIDATOR_ROOT: ${{ steps.validators.outputs.root }}
        run: |
          source "$VALIDATOR_ROOT/bootstrap.sh"
          for snapshot_name in event current; do
            case "$snapshot_name" in
              event)
                body_file="$EVENT_BODY_FILE"
                ;;
              current)
                body_file="$CURRENT_BODY_FILE"
                ;;
            esac
            if [[ ! -f "$body_file" ]]; then
              echo "The $snapshot_name live-evidence snapshot is unavailable." >&2
              exit 1
            fi

            echo "Validating $snapshot_name live-evidence snapshot."
            openkeyboard_validate_live_snapshot \
              "$body_file" "$EVENT_HEAD_SHA" "$LIVE_IMPACT" "$VALIDATOR_ROOT"
          done
